name: Notify docs of Viewer updates

# No path filter, deliberately. verify-bundle runs the whole suite, so a change
# anywhere — tests, schemas, service — can turn this job red, while a filter can
# only ever list the paths someone remembered. That gap already cost two
# releases: a test reading an untracked fixture landed green because its path
# was not watched, and the fix for it could not verify itself for the same
# reason. A list that must stay complete is the failure; deleting it is the fix.
# The job takes about twenty seconds, and a dispatch for an unchanged Viewer
# rebuilds the same artifact, so running it every time costs nothing worth
# keeping a list for.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Viewer and Checklist UI bundles are build products kept under version
  # control for hosts that do not run Vite. Nothing stops a `.svelte` change
  # from being committed without rebuilding, and source-level tests cannot
  # detect that drift. Rebuild both here and compare every committed artifact.
  verify-bundle:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Rebuild committed UI bundles
        run: |
          npm run viewer:ui:build
          npm run checklist:ui:build
          npm run checklist:browser:build

      - name: Fail if the committed bundle is stale
        shell: bash
        run: |
          set -euo pipefail

          bundles=(
            viewer/assets/viewer-ui.js
            src/TaskProgress.Cli/checklist-ui/checklist-ui.js
            src/TaskProgress.Cli/checklist-ui/checklist-ui.css
            viewer/checklist/checklist-ui.js
            viewer/checklist/checklist-ui.css
          )

          if git diff --quiet -- "${bundles[@]}"; then
            echo "All committed UI bundles match their sources."
            exit 0
          fi

          echo "::error::A committed UI bundle is stale. Rebuild the Viewer, Checklist Desktop, and Checklist Browser bundles, then commit the results." >&2
          git diff --stat -- "${bundles[@]}" >&2
          exit 1

      - name: Run the test suite
        run: npm test

  notify:
    needs: verify-bundle
    runs-on: ubuntu-latest

    steps:
      - name: Dispatch docs deployment
        env:
          DOCS_DISPATCH_TOKEN: ${{ secrets.DOCS_DISPATCH_TOKEN }}
          VIEWER_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$DOCS_DISPATCH_TOKEN" ]]; then
            echo "Repository secret DOCS_DISPATCH_TOKEN is required." >&2
            exit 1
          fi

          payload=$(jq -n --arg sha "$VIEWER_SHA" '{
            event_type: "task-progress-viewer-updated",
            client_payload: { sha: $sha }
          }')

          curl --fail-with-body --location \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $DOCS_DISPATCH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/Yu5h1/docs/dispatches \
            --data "$payload"
